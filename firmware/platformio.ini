; AI Assistant — Waveshare ESP32-S3-Knob-Touch-LCD-1.8 only, plus the desktop
; simulator (round 360x360, ring on up/down arrows + mouse wheel).
[platformio]
default_envs = waveshare_knob_18

[env:waveshare_knob_18]
; Waveshare ESP32-S3-Knob-Touch-LCD-1.8 — round 360x360 ST77916 over QSPI,
; CST816 touch, rotary ring (bidirectional detent switch), DRV2605 haptics.
; No PMU, no speaker path. Module is ESP32-S3R8 like the LCD-1.54
; (esptool-verified: "Embedded PSRAM 8MB (AP_3v3)", 16 MB quad flash).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_knob_18/>

build_flags =
    -DBOARD_KNOB_18
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the daemon holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


[env:sim]
; Native desktop simulator — an SDL2 window instead of a panel, mouse as
; touch, keyboard as buttons, JSONL scenario playback instead of BLE. See
; boards/sim/board.h for the key map and scenario format.
; Requires SDL2 dev headers (sdl2-config on PATH): apt install libsdl2-dev.
platform = native

build_src_filter =
    +<*>
    -<boards/>
    +<boards/sim/>
    ; transport + audio are hardware-only: boards/sim/ble_sim.cpp stubs
    ; ble.h with scenario playback, and the sim's sound HAL no-ops.
    -<ble.cpp>
    -<chime.cpp>
    -<es8311.c>

build_flags =
    -DBOARD_SIM
    ; macOS: `g++` is Apple clang, which defaults to C++98 without an explicit
    ; -std and fails on constexpr / brace-init. Linux g++ (real GCC) defaults
    ; to gnu++17, which is why this only bites on macOS.
    -std=gnu++17
    ; behave like the PSRAM-equipped S3 targets (big LVGL strips, full
    ; splash canvas, screenshot path compiled) — the heap shim maps every
    ; capability to plain malloc anyway
    -DBOARD_HAS_PSRAM
    -Isrc/boards/sim/shim
    -lm
    !sdl2-config --cflags --libs
    ; LVGL config — identical to the hardware envs
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1

lib_deps =
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
